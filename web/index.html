<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="HairFlow - Erkek Saç Sağlığı Asistanı. Kişiselleştirilmiş saç bakım rutinleri ve takip sistemi.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <!-- Open Graph / Social Media Meta Tags -->
  <meta property="og:title" content="HairFlow - Saç Sağlığı Asistanı">
  <meta property="og:description" content="Kişiselleştirilmiş saç bakım rutinleri, akıllı hatırlatıcılar ve uzman tavsiyeleriyle saç dökülmesiyle mücadele edin.">
  <meta property="og:type" content="website">
  <meta property="og:image" content="icons/Icon-512.png">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="HairFlow">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Theme Color -->
  <meta name="theme-color" content="#2E7D32">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>HairFlow - Saç Sağlığı Asistanı</title>
  <link rel="manifest" href="manifest.json">

  <!-- Loading Styles -->
  <style>
    :root {
      --primary-color: #2E7D32;
      --primary-light: #4CAF50;
      --bg-dark: #0D1F0E;
    }
    
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
    
    body {
      background: linear-gradient(135deg, var(--bg-dark) 0%, #1A3A1C 50%, #2E5A30 100%);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
    }
    
    .loading-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      background: linear-gradient(135deg, var(--bg-dark) 0%, #1A3A1C 50%, #2E5A30 100%);
    }
    
    .loading-logo {
      width: 80px;
      height: 80px;
      background: linear-gradient(135deg, var(--primary-light) 0%, var(--primary-color) 100%);
      border-radius: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 24px;
      animation: pulse 2s ease-in-out infinite;
      box-shadow: 0 8px 32px rgba(76, 175, 80, 0.3);
    }
    
    .loading-logo svg {
      width: 48px;
      height: 48px;
      fill: white;
    }
    
    .loading-text {
      font-size: 32px;
      font-weight: 700;
      background: linear-gradient(90deg, #81C784 0%, #4CAF50 50%, #2E7D32 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 32px;
    }
    
    .loading-spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(255, 255, 255, 0.1);
      border-top-color: var(--primary-light);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    
    .loading-subtitle {
      font-size: 14px;
      color: rgba(255, 255, 255, 0.5);
      margin-top: 16px;
    }
    
    @keyframes pulse {
      0%, 100% {
        transform: scale(1);
        box-shadow: 0 8px 32px rgba(76, 175, 80, 0.3);
      }
      50% {
        transform: scale(1.05);
        box-shadow: 0 12px 48px rgba(76, 175, 80, 0.5);
      }
    }
    
    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }
    
    /* Hide loading screen when Flutter is ready */
    .flutter-ready .loading-container {
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease-out;
    }
  </style>
</head>
<body>
  <!-- Loading Screen -->
  <div class="loading-container" id="loading">
    <div class="loading-logo">
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 2C9.24 2 7 4.24 7 7c0 2.85 2.92 7.21 5 9.88 2.11-2.69 5-7 5-9.88 0-2.76-2.24-5-5-5zm0 7.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5zM5 20h14v2H5v-2z"/>
      </svg>
    </div>
    <div class="loading-text">HairFlow</div>
    <div class="loading-spinner"></div>
    <div class="loading-subtitle">Yükleniyor...</div>
  </div>

  <script src="flutter_bootstrap.js" async></script>
  
  <script>
    // Hide loading screen when Flutter is ready
    window.addEventListener('flutter-first-frame', function() {
      document.body.classList.add('flutter-ready');
      setTimeout(function() {
        var loading = document.getElementById('loading');
        if (loading) loading.style.display = 'none';
      }, 300);
    });
  </script>
</body>
</html>
